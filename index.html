<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Floorplan Editor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: drafting table — toolbar on top, plan on the left, properties panel on the right, 3D as an overlay. */
:root{
  --paper:#f3f1ec; --paper-2:#e9e6df; --ink:#1f2430; --ink-2:#5b6170; --line:#cfcbc2;
  --accent:#1f5fa8; --accent-soft:#1f5fa822; --wall:#3b3f4a; --wall-fill:#9a9ea8;
  --win:#2b7bd6; --door:#b5651d; --open:#2e9e4f; --warn:#c0392b;
  --font:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1c1e24; --paper-2:#262932; --ink:#e8e6e0; --ink-2:#a3a7b3; --line:#3a3e49;
  --accent:#6ea4e8; --accent-soft:#6ea4e833; --wall:#d6d8de; --wall-fill:#5c6070;
  --win:#5aa0f0; --door:#d98a45; --open:#4fc070; --warn:#e8705f; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1c1e24; --paper-2:#262932; --ink:#e8e6e0; --ink-2:#a3a7b3; --line:#3a3e49;
  --accent:#6ea4e8; --accent-soft:#6ea4e833; --wall:#d6d8de; --wall-fill:#5c6070;
  --win:#5aa0f0; --door:#d98a45; --open:#4fc070; --warn:#e8705f; color-scheme:dark}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:13px;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--paper-2);border:1px solid var(--line);border-radius:4px;padding:5px 9px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=number],input[type=text],select,textarea{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:4px 6px;width:100%;min-width:0}
input[type=number]{font-family:var(--mono);font-variant-numeric:tabular-nums}
header{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--paper-2)}
header h1{font-size:15px;font-weight:600;margin:0 10px 0 0}
.group{display:flex;gap:4px;align-items:center}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
main{flex:1;display:flex;min-height:0}
#plan{flex:1;position:relative;min-width:0;background:var(--paper)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
#hint{position:absolute;left:12px;right:150px;bottom:10px;font-size:12px;color:var(--ink-2);pointer-events:none;background:var(--paper);padding:2px 6px;border-radius:3px}
#zoomctl{position:absolute;right:12px;bottom:10px;display:flex;gap:4px}
aside{width:300px;border-left:1px solid var(--line);background:var(--paper-2);overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:14px}
aside h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);margin:0 0 6px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
label.f{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--ink-2)}
.actions{display:flex;flex-wrap:wrap;gap:4px}
.danger{color:var(--warn)}
.note{font-size:11px;color:var(--ink-2);line-height:1.4}
.pill{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;background:var(--accent-soft);color:var(--accent);font-family:var(--mono)}
textarea{font-family:var(--mono);font-size:11px;min-height:120px;resize:vertical}
#view3d{position:absolute;inset:0;background:var(--paper);display:flex;flex-direction:column}
#view3d[hidden]{display:none}
#view3d canvas{flex:1;width:100%;min-height:0;touch-action:none}
#bar3d{display:flex;gap:6px;padding:6px 12px;border-bottom:1px solid var(--line);background:var(--paper-2);align-items:center;flex-wrap:wrap}
#toast{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:6px 12px;border-radius:4px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
@media (max-width:760px){
  main{flex-direction:column}
  aside{width:auto;border-left:0;border-top:1px solid var(--line);max-height:45%}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

<header>
  <h1>Floorplan Editor</h1>
  <div class="group" id="modes">
    <button data-mode="select" class="on" title="Select, move (S)">Select</button>
    <button data-mode="wall" title="Draw a wall (M)">Wall</button>
    <button data-mode="room" title="Draw a room point by point (P)">Room</button>
    <button data-mode="pan" title="Pan the view (Space)">Pan</button>
  </div>
  <div class="sep"></div>
  <div class="group">
    <button id="undo" title="Undo (Ctrl+Z)">Undo</button>
    <button id="redo" title="Redo (Ctrl+Y)">Redo</button>
  </div>
  <div class="sep"></div>
  <div class="group">
    <button id="btn3d">3D view</button>
    <button id="btnExport">Export</button>
    <button id="btnSave">Save JSON</button>
    <button id="btnLoad">Load JSON</button>
    <input type="file" id="fileLoad" accept=".json,application/json" hidden>
  </div>
</header>

<main>
  <div id="plan">
    <canvas id="cv"></canvas>
    <div id="hint"></div>
    <div id="zoomctl"><button id="zin" title="Zoom in">+</button><button id="zout" title="Zoom out">−</button><button id="zfit">Fit</button></div>
    <div id="view3d" hidden>
      <div id="bar3d">
        <button id="close3d">← Plan</button>
        <span class="note">Drag: rotate · wheel: zoom · right-click or Shift+drag: pan</span>
        <label class="note"><input type="checkbox" id="furn3d" checked> furniture</label>
        <label class="note"><input type="checkbox" id="floor3d" checked> floors</label>
      </div>
      <canvas id="cv3"></canvas>
    </div>
    <div id="toast"></div>
  </div>
  <aside id="side"></aside>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
'use strict';
// ------------------------------------------------------------------ data
const INITIAL = {"t":10,"h":250,"walls":[{"id":"w1","x1":0,"y1":0,"x2":500,"y2":0,"t":10,"h":250,"side":1},{"id":"w2","x1":500,"y1":0,"x2":500,"y2":400,"t":10,"h":250,"side":1},{"id":"w3","x1":500,"y1":400,"x2":0,"y2":400,"t":10,"h":250,"side":1},{"id":"w4","x1":0,"y1":400,"x2":0,"y2":0,"t":10,"h":250,"side":1}],"openings":[{"id":"o1","wall":"w1","type":"fenetre","pos":180,"w":140,"z0":90,"z1":215},{"id":"o2","wall":"w3","type":"porte","pos":60,"w":90,"z0":0,"z1":210,"hinge":"start","out":false}],"rooms":[{"id":"r1","name":"Living room","pts":[[0,0],[500,0],[500,400],[0,400]]}],"furn":[{"id":"f1","name":"3-seat sofa","x":110,"y":200,"w":220,"d":95,"h":85,"rot":270,"color":"#8a9bb0"},{"id":"f2","name":"Coffee table","x":250,"y":200,"w":110,"d":60,"h":40,"rot":90,"color":"#b89a6a"},{"id":"f3","name":"TV stand","x":477.5,"y":200,"w":160,"d":45,"h":50,"rot":90,"color":"#6f6a63"}]};
const CATALOG=[["Corner sofa",290,97,85,"L"],["3-seat sofa",220,95,85],["2-seat sofa",170,95,85],["Armchair",90,90,85],["Coffee table",110,60,40],["Dining table",160,90,75],["Chair",45,45,90],["TV stand",160,45,50],["Bookcase",80,30,200],["Sideboard",180,50,85],["Desk",140,70,75],["Double bed 160",160,200,50],["Rug",200,300,1],["Plant",40,40,120],["Generic block",100,100,100]];
// type keys (fenetre/porte/ouverture) are part of the saved plan format and stay unchanged
const TYPES={fenetre:{label:"Window",color:"var(--win)",z0:90,z1:215},porte:{label:"Door",color:"var(--door)",z0:0,z1:210},ouverture:{label:"Opening",color:"var(--open)",z0:0,z1:250}};
let S=null, hist=[], hpos=-1;
const clone=o=>JSON.parse(JSON.stringify(o));
function loadInitial(){
  try{const s=localStorage.getItem('floorplan-editor-v1'); if(s){S=JSON.parse(s);return;}}catch(e){}
  S=clone(INITIAL);
}
function commit(){ // push a state onto the undo history
  hist=hist.slice(0,hpos+1); hist.push(clone(S)); if(hist.length>80)hist.shift(); hpos=hist.length-1;
  try{localStorage.setItem('floorplan-editor-v1',JSON.stringify(S));}catch(e){}
  draw(); if(!v3.hidden) build3d();
}
function undo(){ if(hpos>0){hpos--;S=clone(hist[hpos]);sel=null;refresh();} }
function redo(){ if(hpos<hist.length-1){hpos++;S=clone(hist[hpos]);sel=null;refresh();} }
let idc=1000; const uid=p=>p+(idc++);

// ------------------------------------------------------------------ geometry
const EPS=0.6;
function wgeo(w){ const dx=w.x2-w.x1,dy=w.y2-w.y1,L=Math.hypot(dx,dy)||1; return {L,ux:dx/L,uy:dy/L,nx:dy/L*(w.side||1),ny:-dx/L*(w.side||1)}; }
function wp(w,g,u,v){ return [w.x1+g.ux*u+g.nx*v, w.y1+g.uy*u+g.ny*v]; }
function near(a,b){ return Math.hypot(a[0]-b[0],a[1]-b[1])<EPS; }
function lineInter(p,d,q,e){ const den=d[0]*e[1]-d[1]*e[0]; if(Math.abs(den)<1e-9)return null; const t=((q[0]-p[0])*e[1]-(q[1]-p[1])*e[0])/den; return [p[0]+d[0]*t,p[1]+d[1]*t]; }
// miter cut point at one end (end=0 start, 1 end)
function miter(w,g,end){
  const P=end?[w.x2,w.y2]:[w.x1,w.y1];
  const def=wp(w,g,end?g.L:0,w.t);
  for(const o of S.walls){ if(o===w)continue;
    let oe=-1; if(near([o.x1,o.y1],P))oe=0; else if(near([o.x2,o.y2],P))oe=1; if(oe<0)continue;
    const og=wgeo(o);
    const p1=wp(w,g,0,w.t), p2=wp(o,og,0,o.t);
    const m=lineInter(p1,[g.ux,g.uy],p2,[og.ux,og.uy]);
    if(!m)continue;
    if(Math.hypot(m[0]-P[0],m[1]-P[1])>3*Math.max(w.t,o.t)+1)continue;
    return m;
  }
  return def;
}
function wallPoly(w){ const g=wgeo(w); return [wp(w,g,0,0),wp(w,g,g.L,0),miter(w,g,1),miter(w,g,0)]; }
function wallOpenings(w){ return S.openings.filter(o=>o.wall===w.id).sort((a,b)=>a.pos-b.pos); }
// 3D pieces of a wall: list of {quad:[4 pts], z0, z1}
function wallPieces(w){
  const g=wgeo(w), L=g.L, h=w.h, ms=miter(w,g,0), me=miter(w,g,1), out=[];
  const quad=(u0,u1)=>[wp(w,g,u0,0),wp(w,g,u1,0),u1>=L-1e-6?me:wp(w,g,u1,w.t),u0<=1e-6?ms:wp(w,g,u0,w.t)];
  let u=0;
  for(const o of wallOpenings(w)){
    const a=Math.max(u,Math.min(L,o.pos)), b=Math.max(a,Math.min(L,o.pos+o.w));
    if(a>u+1e-6) out.push({quad:quad(u,a),z0:0,z1:h});
    if(b>a+1e-6){ if(o.z0>0) out.push({quad:quad(a,b),z0:0,z1:Math.min(o.z0,h)}); if(o.z1<h) out.push({quad:quad(a,b),z0:Math.max(o.z1,0),z1:h}); }
    u=b;
  }
  if(u<L-1e-6) out.push({quad:quad(u,L),z0:0,z1:h});
  return out;
}
function polyArea(p){ let a=0; for(let i=0;i<p.length;i++){const q=p[(i+1)%p.length];a+=p[i][0]*q[1]-q[0]*p[i][1];} return a/2; }
function inPoly(pt,p){ let c=false; for(let i=0,j=p.length-1;i<p.length;j=i++){ const a=p[i],b=p[j]; if((a[1]>pt[1])!==(b[1]>pt[1]) && pt[0]<(b[0]-a[0])*(pt[1]-a[1])/(b[1]-a[1])+a[0]) c=!c;} return c; }
function furnCorners(f){ const r=f.rot*Math.PI/180,c=Math.cos(r),s=Math.sin(r); let loc;
  if(f.shape==='L'){ const W=f.w,D=f.d,W2=f.w2||100,D2=Math.max(f.d2||180,D); // back block W×D, return W2×D2 on the left (back at top) or on the right
    loc=f.corner==='droite'?[[0,0],[W,0],[W,D2],[W-W2,D2],[W-W2,D],[0,D]]:[[0,0],[W,0],[W,D],[W2,D],[W2,D2],[0,D2]];
    loc=loc.map(([x,y])=>[x-W/2,y-D2/2]); }
  else loc=[[-f.w/2,-f.d/2],[f.w/2,-f.d/2],[f.w/2,f.d/2],[-f.w/2,f.d/2]];
  return loc.map(([x,y])=>[f.x+x*c-y*s,f.y+x*s+y*c]); }
function distSeg(p,a,b){ const dx=b[0]-a[0],dy=b[1]-a[1],l2=dx*dx+dy*dy; let t=l2?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l2:0; t=Math.max(0,Math.min(1,t)); return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy); }
// move a vertex and every wall vertex that coincides with it
function moveVertex(w,end,nx,ny){
  const P=end?[w.x2,w.y2]:[w.x1,w.y1];
  for(const o of S.walls){ if(near([o.x1,o.y1],P)){o.x1=nx;o.y1=ny;} if(near([o.x2,o.y2],P)){o.x2=nx;o.y2=ny;} }
  for(const r of S.rooms) for(const p of r.pts) if(near(p,P)){p[0]=nx;p[1]=ny;}
}
// point each wall's thickness towards the outside of the loop it forms with its neighbours
function orientWalls(){
  const seen=new Set(); let changed=0;
  for(const w0 of S.walls){ if(seen.has(w0))continue;
    const chain=[{w:w0,fwd:true}]; seen.add(w0); const first=[w0.x1,w0.y1]; let P=[w0.x2,w0.y2]; const pts=[first,P];
    for(let k=0;k<500;k++){ if(near(P,first))break;
      const nx=S.walls.find(o=>!seen.has(o)&&(near([o.x1,o.y1],P)||near([o.x2,o.y2],P))); if(!nx)break;
      const fwd=near([nx.x1,nx.y1],P); seen.add(nx); chain.push({w:nx,fwd}); P=fwd?[nx.x2,nx.y2]:[nx.x1,nx.y1]; pts.push(P); }
    let Q=first; for(let k=0;k<500;k++){ if(near(Q,P))break;
      const nx=S.walls.find(o=>!seen.has(o)&&(near([o.x1,o.y1],Q)||near([o.x2,o.y2],Q))); if(!nx)break;
      const fwd=near([nx.x2,nx.y2],Q); seen.add(nx); chain.unshift({w:nx,fwd}); Q=fwd?[nx.x1,nx.y1]:[nx.x2,nx.y2]; pts.unshift(Q); }
    if(chain.length<2)continue;
    const sgn=polyArea(pts)>0?1:-1;
    for(const c of chain){ const want=sgn*(c.fwd?1:-1); if((c.w.side||1)!==want){c.w.side=want;changed++;} }
  }
  return changed;
}
// snap furniture to the inner wall faces (two passes: one wall, then a non-parallel wall to fit into a corner)
function snapFurn(f){
  const tol=Math.max(8,14/view.z); let first=null;
  for(let pass=0;pass<2;pass++){
    const c=furnCorners(f); let best=null;
    for(const w of S.walls){ const g=wgeo(w); const inx=-g.nx,iny=-g.ny; // normal pointing into the room
      if(first&&Math.abs(inx*first[0]+iny*first[1])>0.7)continue;
      for(const q of c){ const u=(q[0]-w.x1)*g.ux+(q[1]-w.y1)*g.uy; if(u<-tol||u>g.L+tol)continue;
        const dist=(q[0]-w.x1)*inx+(q[1]-w.y1)*iny; // >0: room side
        if(Math.abs(dist)<tol&&(!best||Math.abs(dist)<Math.abs(best.dist)))best={dist,inx,iny}; } }
    if(!best)break;
    f.x=Math.round((f.x-best.dist*best.inx)*10)/10; f.y=Math.round((f.y-best.dist*best.iny)*10)/10; first=[best.inx,best.iny];
  }
}
// trace the closed room bounded by walls, starting from one wall
function traceRoom(start){
  const ends=w=>[[w.x1,w.y1],[w.x2,w.y2]];
  let pts=[[start.x1,start.y1]], cur=start, P=[start.x2,start.y2], prevDir=Math.atan2(start.y2-start.y1,start.x2-start.x1);
  for(let k=0;k<200;k++){
    pts.push(P);
    if(near(P,pts[0])&&k>0){pts.pop();return pts;}
    let best=null,bestA=1e9;
    for(const o of S.walls){ if(o===cur)continue; const e=ends(o); let far=null;
      if(near(e[0],P))far=e[1]; else if(near(e[1],P))far=e[0]; if(!far)continue;
      const d=Math.atan2(far[1]-P[1],far[0]-P[0]); let a=d-prevDir; while(a<=-Math.PI)a+=2*Math.PI; while(a>Math.PI)a-=2*Math.PI;
      a=(start.side||1)>0? a : -a; // prefer turning towards the inside
      const score=Math.PI-a; if(score<bestA){bestA=score;best={o,far,d};}
    }
    if(!best)return null;
    cur=best.o;P=best.far;prevDir=best.d;
  }
  return null;
}

// ------------------------------------------------------------------ 2D view
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let view={z:1,ox:60,oy:60}, mode='select', sel=null, drag=null, tmp=null, mouse=null, hover=null;
const w2s=(x,y)=>[x*view.z+view.ox,y*view.z+view.oy], s2w=(x,y)=>[(x-view.ox)/view.z,(y-view.oy)/view.z];
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function resize(){ const r=cv.parentElement.getBoundingClientRect(); cv.width=r.width*devicePixelRatio; cv.height=r.height*devicePixelRatio; cv.style.width=r.width+'px'; cv.style.height=r.height+'px'; draw(); }
function fit(){ const xs=[],ys=[]; for(const w of S.walls){xs.push(w.x1,w.x2);ys.push(w.y1,w.y2);} for(const f of S.furn){xs.push(f.x);ys.push(f.y);} if(!xs.length){xs.push(0,400);ys.push(0,400);}
  const minx=Math.min(...xs)-40,maxx=Math.max(...xs)+40,miny=Math.min(...ys)-40,maxy=Math.max(...ys)+40, W=cv.width/devicePixelRatio,H=cv.height/devicePixelRatio;
  view.z=Math.min(W/(maxx-minx),H/(maxy-miny)); view.ox=(W-(maxx+minx)*view.z)/2; view.oy=(H-(maxy+miny)*view.z)/2; draw(); }
function draw(){
  if(!S)return;
  const W=cv.width/devicePixelRatio,H=cv.height/devicePixelRatio;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); ctx.clearRect(0,0,W,H);
  ctx.fillStyle=css('--paper'); ctx.fillRect(0,0,W,H);
  // 50 cm grid
  const step=view.z>0.25?50:100; ctx.strokeStyle=css('--line'); ctx.lineWidth=.5; ctx.beginPath();
  const [x0,y0]=s2w(0,0),[x1,y1]=s2w(W,H);
  for(let x=Math.floor(x0/step)*step;x<x1;x+=step){const [sx]=w2s(x,0);ctx.moveTo(sx,0);ctx.lineTo(sx,H);}
  for(let y=Math.floor(y0/step)*step;y<y1;y+=step){const [,sy]=w2s(0,y);ctx.moveTo(0,sy);ctx.lineTo(W,sy);} ctx.stroke();
  ctx.font='12px '+css('--mono');
  // rooms
  for(const r of S.rooms){ if(r.pts.length<3)continue; ctx.beginPath(); r.pts.forEach((p,i)=>{const s=w2s(p[0],p[1]); i?ctx.lineTo(s[0],s[1]):ctx.moveTo(s[0],s[1]);}); ctx.closePath();
    ctx.fillStyle=sel&&sel.kind==='room'&&sel.obj===r?css('--accent-soft'):'rgba(150,130,90,.10)'; ctx.fill();
    ctx.strokeStyle=css('--ink-2'); ctx.setLineDash([3,3]); ctx.lineWidth=1; ctx.stroke(); ctx.setLineDash([]);
    const c=r.pts.reduce((a,p)=>[a[0]+p[0]/r.pts.length,a[1]+p[1]/r.pts.length],[0,0]); const s=w2s(c[0],c[1]);
    ctx.fillStyle=css('--ink-2'); ctx.textAlign='center'; ctx.fillText(r.name+' · '+(Math.abs(polyArea(r.pts))/1e4).toFixed(2)+' m²',s[0],s[1]); }
  // walls
  for(const w of S.walls){ const poly=wallPoly(w); ctx.beginPath(); poly.forEach((p,i)=>{const s=w2s(p[0],p[1]); i?ctx.lineTo(s[0],s[1]):ctx.moveTo(s[0],s[1]);}); ctx.closePath();
    const isSel=sel&&sel.kind==='wall'&&sel.obj===w; ctx.fillStyle=isSel?css('--accent'):css('--wall-fill'); ctx.fill(); ctx.strokeStyle=css('--wall'); ctx.lineWidth=1; ctx.stroke();
    const g=wgeo(w);

function snapPt(p,excludeWall){

  for(let i=S.furn.length-1;i>=0;i--){ if(inPoly(p,furnCorners(S.furn[i])))return {kind:'furn',obj:S.furn[i]}; }
  for(const w of S.walls){ if(inPoly(p,wallPoly(w))||distSeg(p,[w.x1,w.y1],[w.x2,w.y2])<tol)return {kind:'wall',obj:w}; }

    bindNum('w_t',v=>w.t=v); bindNum('w_h',v=>w.h=v);
    on('flipSide',()=>{w.side=-(w.side||1);commit();renderSide();});
    on('splitWall',()=>{const g=wgeo(w),m=wp(w,g,g.L/2,0); const n={...clone(w),id:uid('w'),x1:m[0],y1:m[1]}; w.x2=m[0];w.y2=m[1]; for(const o of wallOpenings(w)) if(o.pos>=g.L/2){o.wall=n.id;o.pos-=g.L/2;} S.walls.push(n); commit(); renderSide();});
    on('roomFrom',()=>{const pts=traceRoom(w); if(!pts){toast('Outline not closed: the walls do not meet.');return;} S.rooms.push({id:uid('r'),name:'Room '+(S.rooms.length+1),pts:pts.map(p=>[p[0],p[1]])}); sel={kind:'room',obj:S.rooms[S.rooms.length-1]}; commit(); renderSide();});
    side.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const t=b.dataset.add,g=wgeo(w); const o={id:uid('o'),wall:w.id,type:t,pos:Math.max(0,Math.round(g.L/2-45)),w:Math.min(90,Math.round(g.L)),z0:TYPES[t].z0,z1:t==='ouverture'?w.h:TYPES[t].z1}; S.openings.push(o); sel={kind:'opening',obj:o,wall:w}; commit(); renderSide();});
  }
  if(sel&&sel.kind==='opening'){ const o=sel.obj; const t=q('o_type'); if(t)t.onchange=()=>{o.type=t.value; o.z0=TYPES[o.type].z0; o.z1=o.type==='ouverture'?(S.walls.find(x=>x.id===o.wall)||{h:S.h}).h:TYPES[o.type].z1; commit(); renderSide();};
    bindNum('o_pos',v=>o.pos=v); bindNum('o_w',v=>o.w=v); bindNum('o_z0',v=>o.z0=v); bindNum('o_z1',v=>o.z1=v);
    const hg=q('o_hinge'); if(hg)hg.onchange=()=>{o.hinge=hg.value;commit();}; const ou=q('o_out'); if(ou)ou.onchange=()=>{o.out=ou.value==='out';commit();}; on('o_mirror',()=>{o.hinge=o.hinge==='end'?'start':'end';commit();renderSide();}); }
  if(sel&&sel.kind==='room'){ const r=sel.obj; const n=q('r_name'); n.onchange=()=>{r.name=n.value;commit();};
    on('r_apply',()=>{const pts=q('r_pts').value.split('\n').map(l=>l.trim().split(/[\s,;]+/).map(Number)).filter(p=>p.length===2&&!p.some(isNaN)); if(pts.length<3){toast('At least 3 points are required.');return;} r.pts=pts; commit(); renderSide();}); }
  if(sel&&sel.kind==='furn'){ const f=sel.obj; const n=q('f_name'); n.onchange=()=>{f.name=n.value;commit();}; const c=q('f_color'); c.onchange=()=>{f.color=c.value;commit();};
    bindNum('f_x',v=>f.x=v); bindNum('f_y',v=>f.y=v); bindNum('f_w',v=>f.w=v); bindNum('f_d',v=>f.d=v); bindNum('f_h',v=>f.h=v); bindNum('f_rot',v=>f.rot=v); bindNum('f_w2',v=>f.w2=v); bindNum('f_d2',v=>f.d2=v); const fc=q('f_corner'); if(fc)fc.onchange=()=>{f.corner=fc.value;commit();};
    on('rotFurn',()=>{f.rot=(f.rot+90)%360;snapFurn(f);commit();renderSide();}); on('snapFurn',()=>{snapFurn(f);commit();renderSide();});
    on('dupFurn',()=>{const n={...clone(f),id:uid('f'),x:f.x+f.w+10}; S.furn.push(n); sel={kind:'furn',obj:n}; commit(); renderSide();}); }
}
function refresh(){ renderSide(); draw(); if(!v3.hidden)build3d(); }
let toastT; function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),3000); }

// ------------------------------------------------------------------ mesh (shared by 3D view and STL)
// model frame: x right, y down (as on the plan), z up. Triangles are emitted with outward normals.
function prism(quad, z0, z1, out){
  let p=quad.slice(); if(polyArea(p)<0)p.reverse(); // order so the top faces +z after reflection
  const n=p.length, top=p.map(q=>[q[0],q[1],z1]), bot=p.map(q=>[q[0],q[1],z0]);
  if(n<=4){ for(let i=1;i<n-1;i++){ out.push([top[0],top[i],top[i+1]]); out.push([bot[0],bot[i+1],bot[i]]); } }
  else { for(const t of earClip(p)){ out.push([[t[0][0],t[0][1],z1],[t[1][0],t[1][1],z1],[t[2][0],t[2][1],z1]]); out.push([[t[0][0],t[0][1],z0],[t[2][0],t[2][1],z0],[t[1][0],t[1][1],z0]]); } }
  for(let i=0;i<n;i++){ const j=(i+1)%n; out.push([bot[i],bot[j],top[j]]); out.push([bot[i],top[j],top[i]]); }
}
function buildTriangles(opt){ // opt: {floor, furn, slab, hmax}
  const tris=[];
  for(const w of S.walls) for(const pc of wallPieces(w)){ const z1=opt.hmax?Math.min(pc.z1,opt.hmax):pc.z1; if(z1>pc.z0) prism(pc.quad,pc.z0,z1,tris); }
  if(opt.floor) for(const r of S.rooms) if(r.pts.length>=3) { // fan triangulation is enough for a simple piecewise-convex outline; otherwise ear clipping
    const ears=earClip(r.pts); for(const t of ears){ prism(t,-(opt.slab||1),0,tris); } }
  if(opt.furn) for(const f of S.furn) prism(furnCorners(f),0,f.h,tris);
  return tris;
}
function earClip(poly){ // returns triangles [a,b,c]
  let p=poly.map(q=>[q[0],q[1]]); if(polyArea(p)<0)p.reverse(); const tris=[]; let guard=0;
  while(p.length>3&&guard++<2000){ let found=false;
    for(let i=0;i<p.length;i++){ const a=p[(i+p.length-1)%p.length],b=p[i],c=p[(i+1)%p.length]; if(polyArea([a,b,c])<=0)continue;
      let ok=true; for(const q of p){ if(q===a||q===b||q===c)continue; if(inPoly(q,[a,b,c])){ok=false;break;} } if(!ok)continue;
      tris.push([a,b,c]); p.splice(i,1); found=true; break; }
    if(!found)break; }
  if(p.length===3)tris.push(p); return tris;
}
function stlBinary(tris, scale){ // convert to print frame: X=x, Y=-y, Z=z (reflection → reversed winding)
  const n=tris.length, buf=new ArrayBuffer(84+n*50), dv=new DataView(buf); dv.setUint32(80,n,true); let o=84;
  for(const t of tris){ const v=[t[0],t[2],t[1]].map(q=>[q[0]*scale,-q[1]*scale,q[2]*scale]);
    const ux=v[1][0]-v[0][0],uy=v[1][1]-v[0][1],uz=v[1][2]-v[0][2],vx=v[2][0]-v[0][0],vy=v[2][1]-v[0][1],vz=v[2][2]-v[0][2];
    let nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx; const l=Math.hypot(nx,ny,nz)||1;
    dv.setFloat32(o,nx/l,true);dv.setFloat32(o+4,ny/l,true);dv.setFloat32(o+8,nz/l,true);o+=12;
    for(const q of v){dv.setFloat32(o,q[0],true);dv.setFloat32(o+4,q[1],true);dv.setFloat32(o+8,q[2],true);o+=12;}
    dv.setUint16(o,0,true);o+=2; }
  return buf;
}

// ------------------------------------------------------------------ 3D view (three.js)
const v3=document.getElementById('view3d'), cv3=document.getElementById('cv3');
let renderer,scene,camera,orbit={theta:-0.8,phi:1.0,r:900,cx:220,cz:350},meshes=[];
function init3d(){ if(renderer)return; renderer=new THREE.WebGLRenderer({canvas:cv3,antialias:true}); scene=new THREE.Scene(); camera=new THREE.PerspectiveCamera(45,1,5,20000);
  scene.add(new THREE.HemisphereLight(0xffffff,0x667788,0.9)); const d=new THREE.DirectionalLight(0xffffff,0.7); d.position.set(300,800,500); scene.add(d);
  let dr=null; cv3.addEventListener('pointerdown',e=>{cv3.setPointerCapture(e.pointerId);dr={x:e.clientX,y:e.clientY,b:e.button,sh:e.shiftKey};});
  cv3.addEventListener('pointermove',e=>{ if(!dr)return; const dx=e.clientX-dr.x,dy=e.clientY-dr.y; dr.x=e.clientX;dr.y=e.clientY;
    if(dr.b===2||dr.sh){ const s=orbit.r*0.0015; orbit.cx-=(dx*Math.cos(orbit.theta)-dy*Math.sin(orbit.theta))*s*-1; orbit.cz-=(dx*Math.sin(orbit.theta)+dy*Math.cos(orbit.theta))*s*-1; }
    else { orbit.theta-=dx*0.006; orbit.phi=Math.max(0.05,Math.min(1.55,orbit.phi-dy*0.006)); } render3d(); });
  const up=()=>dr=null; cv3.addEventListener('pointerup',up); cv3.addEventListener('pointercancel',up); cv3.addEventListener('contextmenu',e=>e.preventDefault());
  cv3.addEventListener('wheel',e=>{e.preventDefault(); orbit.r=Math.max(100,Math.min(8000,orbit.r*Math.exp(e.deltaY*0.001))); render3d();},{passive:false});
  document.getElementById('furn3d').onchange=build3d; document.getElementById('floor3d').onchange=build3d;
}
function build3d(){ init3d(); for(const m of meshes)scene.remove(m); meshes=[];
  const add=(tris,color,opacity)=>{ if(!tris.length)return; const arr=new Float32Array(tris.length*9); let i=0; for(const t of tris) for(const q of [t[0],t[2],t[1]]){arr[i++]=q[0];arr[i++]=q[2];arr[i++]=q[1];}
    const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(arr,3)); g.computeVertexNormals();
    const m=new THREE.Mesh(g,new THREE.MeshLambertMaterial({color,transparent:opacity<1,opacity})); scene.add(m); meshes.push(m);
    const e=new THREE.LineSegments(new THREE.EdgesGeometry(g,20),new THREE.LineBasicMaterial({color:0x222222,transparent:true,opacity:.35})); scene.add(e); meshes.push(e); };
  const walls=[]; for(const w of S.walls) for(const pc of wallPieces(w)) prism(pc.quad,pc.z0,pc.z1,walls); add(walls,0xd8d6cf,1);
  if(document.getElementById('floor3d').checked){ const fl=[]; for(const r of S.rooms) if(r.pts.length>=3) for(const t of earClip(r.pts)) prism(t,-2,0,fl); add(fl,0xc9b48a,1); }
  if(document.getElementById('furn3d').checked) for(const f of S.furn){ const t=[]; prism(furnCorners(f),0,f.h,t); add(t,new THREE.Color(f.color).getHex(),1); }
  const grid=new THREE.GridHelper(2000,40,0x888888,0xcccccc); grid.position.y=-2.5; scene.add(grid); meshes.push(grid);
  // centre the camera
  const xs=[],ys=[]; for(const w of S.walls){xs.push(w.x1,w.x2);ys.push(w.y1,w.y2);} if(xs.length){orbit.cx=(Math.min(...xs)+Math.max(...xs))/2; orbit.cz=(Math.min(...ys)+Math.max(...ys))/2; if(!orbit.auto){orbit.r=Math.max(600,1.6*Math.max(Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys)));orbit.auto=true;}}
  render3d(); }
function render3d(){ if(!renderer||v3.hidden)return; const r=cv3.getBoundingClientRect(); if(cv3.width!==Math.round(r.width*devicePixelRatio)){renderer.setSize(r.width,r.height,false); camera.aspect=r.width/r.height; camera.updateProjectionMatrix();}
  scene.background=new THREE.Color(css('--paper'));
  camera.position.set(orbit.cx+orbit.r*Math.cos(orbit.phi)*Math.sin(orbit.theta), orbit.r*Math.sin(orbit.phi), orbit.cz+orbit.r*Math.cos(orbit.phi)*Math.cos(orbit.theta)); camera.lookAt(orbit.cx,60,orbit.cz); renderer.render(scene,camera); }
document.getElementById('btn3d').onclick=()=>{ if(typeof THREE==='undefined'){toast('3D library not loaded (offline?)');return;} v3.hidden=false; build3d(); };
document.getElementById('close3d').onclick=()=>{ v3.hidden=true; resize(); };

// ------------------------------------------------------------------ export / save
let dl=null; (async()=>{ try{ dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null; }catch(e){dl=null;} })();
async function saveFile(name,data){ // via the downloads capability, otherwise a download link (file opened locally)
  if(dl){ try{ await dl.save({filename:name,data}); toast('File saved: '+name); return; }catch(e){ if(e&&e.code==='declined')return; if(e&&e.code!=='unavailable'){toast('Download failed ('+(e.code||e.message)+')');return;} } }
  const blob=data instanceof Blob?data:new Blob([data]); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000); }
document.getElementById('btnSave').onclick=()=>saveFile('plan.json',JSON.stringify(S,null,1));
document.getElementById('btnLoad').onclick=()=>document.getElementById('fileLoad').click();
document.getElementById('fileLoad').onchange=e=>{ const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.walls)throw 0; S=d; sel=null; orientWalls(); commit(); renderSide(); fit(); toast('Plan loaded'); }catch(err){toast('Invalid JSON file');} }; r.readAsText(f); e.target.value=''; };
document.getElementById('btnExport').onclick=()=>{ sel=null; draw();
  side.innerHTML=`<section><h2>3D printing (STL)</h2>
    <div class="row">${num('e_scale','Scale 1:N',50)}${num('e_slab','Slab (printed mm)',1.5,.5)}</div>
    <div class="row">${num('e_hmax','Max wall height (real cm, 0 = full)',0)}<label class="f">Contents<select id="e_what"><option value="walls">Walls + slab</option><option value="all">Walls + slab + furniture</option><option value="furn">Furniture only</option></select></label></div>
    <p class="note" id="e_info"></p>
    <div class="actions"><button id="e_stl">Export STL (zip)</button><button id="e_png">Plan image (PNG)</button><button id="e_back">Back</button></div>
    <p class="note">The STL is in millimetres, already scaled. It comes in a zip: unzip it, then open it in your slicer. Rooms produce the slab, walls are solid, openings are cut out.</p></section>`;
  const info=()=>{ const sc=+document.getElementById('e_scale').value||50; const xs=[],ys=[]; for(const w of S.walls){xs.push(w.x1,w.x2);ys.push(w.y1,w.y2);} if(!xs.length)return; const W=(Math.max(...xs)-Math.min(...xs)+2*S.t)*10/sc,D=(Math.max(...ys)-Math.min(...ys)+2*S.t)*10/sc,H=Math.max(...S.walls.map(w=>w.h))*10/sc; document.getElementById('e_info').textContent=`Printed size: ${W.toFixed(0)} × ${D.toFixed(0)} × ${H.toFixed(0)} mm (walls ${(S.t*10/sc).toFixed(1)} mm thick)`; };
  info(); document.getElementById('e_scale').oninput=info;
  document.getElementById('e_back').onclick=renderSide;
  document.getElementById('e_stl').onclick=async()=>{ const sc=+document.getElementById('e_scale').value||50, what=document.getElementById('e_what').value, hmax=+document.getElementById('e_hmax').value||0, slabmm=+document.getElementById('e_slab').value||0;
    const tris=buildTriangles({floor:what!=='furn',furn:what!=='walls',slab:slabmm*sc/10,hmax}); if(!tris.length){toast('Nothing to export');return;}
    const stl=stlBinary(tris,10/sc); if(typeof JSZip==='undefined'){saveFile(`plan_1-${sc}.stl`,stl);return;} const zip=new JSZip(); zip.file(`plan_1-${sc}.stl`,stl); const blob=await zip.generateAsync({type:'blob'}); saveFile(`plan_1-${sc}_stl.zip`,blob); };
  document.getElementById('e_png').onclick=()=>{ cv.toBlob(b=>saveFile('plan.png',b),'image/png'); };
};

loadInitial(); hist=[clone(S)]; hpos=0; renderSide(); setMode('select');
window.addEventListener('resize',()=>{resize(); if(!v3.hidden)render3d();}); resize(); fit();
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{draw();render3d();});
